    async function searchMusicAPI(query) {
      if (!query.trim()) return [];
      const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=6`);
      const data = await res.json();
      return (data.results || []).map(item => ({
        id: `music_${item.trackId}`,
        title: item.trackName,
        creator: item.artistName,
        cover: item.artworkUrl100 ? item.artworkUrl100.replace('100x100', '300x300') : 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300',
        type: 'Música',
        year: item.releaseDate ? item.releaseDate.slice(0, 4) : ''
      }));
    }

    async function searchBooksAPI(query) {
      if (!query.trim()) return [];
      const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}&maxResults=6`);
      const data = await res.json();
      return (data.items || []).map(item => {
        const info = item.volumeInfo || {};
        return {
          id: `book_${item.id}`,
          title: info.title || 'Sin título',
          creator: info.authors ? info.authors.join(', ') : 'Autor desconocido',
          cover: info.imageLinks?.thumbnail?.replace('http:', 'https:') || 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=300',
          type: 'Libro',
          year: info.publishedDate ? info.publishedDate.slice(0, 4) : ''
        };
      });
    }

    async function searchMoviesAPI(query) {
      if (!query.trim()) return [];
      if (!TMDB_API_KEY) {
        // Fallback usando iTunes Movies API si el usuario aún no ha pegado su API Key de TMDB
        const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=movie&limit=6`);
        const data = await res.json();
        return (data.results || []).map(item => ({
          id: `movie_${item.trackId}`,
          title: item.trackName,
          creator: item.artistName || 'Director',
          cover: item.artworkUrl100 ? item.artworkUrl100.replace('100x100', '300x300') : 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=300',
          type: 'Película',
          year: item.releaseDate ? item.releaseDate.slice(0, 4) : ''
        }));
      }
      const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}&language=es-ES`);
      const data = await res.json();
      return (data.results || []).slice(0, 6).map(item => ({
        id: `movie_${item.id}`,
        title: item.title,
        creator: 'Película',
        cover: item.poster_path ? `https://image.tmdb.org/t/p/w300${item.poster_path}` : 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=300',
        type: 'Película',
        year: item.release_date ? item.release_date.slice(0, 4) : ''
      }));
    }

      // Estados de Búsqueda Global

      const [apiResults, setApiResults] = useState([]);
      const [isSearching, setIsSearching] = useState(false);

      const [usersList, setUsersList] = useState(MOCK_USERS);
      const [conversations, setConversations] = useState(MOCK_CONVERSATIONS);
      const [activeChatId, setActiveChatId] = useState(null);
      const [messageInput, setMessageInput] = useState('');

      // Estados para Crear Memory con búsqueda integrada
      const [newPhotoUrl, setNewPhotoUrl] = useState('');
      const [newCaption, setNewCaption] = useState('');
      const [songSearchTerm, setSongSearchTerm] = useState('');
      const [songSuggestions, setSongSuggestions] = useState([]);
      const [selectedSong, setSelectedSong] = useState(null);

      const [mediaSearchTerm, setMediaSearchTerm] = useState('');
      const [mediaSuggestions, setMediaSuggestions] = useState([]);
      const [selectedMedia, setSelectedMedia] = useState(null);
      const [newMediaType, setNewMediaType] = useState('Película');

      // Efecto para Búsqueda en la pestaña "Buscar"
      useEffect(() => {
        if (searchCategory === 'users') {
          setApiResults([]);
          return;
        }
        if (!searchQuery.trim()) {
          setApiResults([]);
          return;
        }
        const timer = setTimeout(async () => {
          setIsSearching(true);
          try {
            if (searchCategory === 'music') setApiResults(await searchMusicAPI(searchQuery));
            if (searchCategory === 'movies') setApiResults(await searchMoviesAPI(searchQuery));
            if (searchCategory === 'books') setApiResults(await searchBooksAPI(searchQuery));
          } catch (err) {
            console.error(err);
          } finally {
            setIsSearching(false);
          }
        }, 400);
        return () => clearTimeout(timer);
      }, [searchQuery, searchCategory]);

      // Autocompletado de Canción dentro del Modal Crear Memory
      useEffect(() => {
        if (!songSearchTerm.trim() || selectedSong?.title === songSearchTerm) {
          setSongSuggestions([]);
          return;
        }
        const timer = setTimeout(async () => {
          const results = await searchMusicAPI(songSearchTerm);
          setSongSuggestions(results.slice(0, 3));
        }, 400);
        return () => clearTimeout(timer);
      }, [songSearchTerm]);

      // Autocompletado de Película/Libro dentro del Modal Crear Memory
      useEffect(() => {
        if (!mediaSearchTerm.trim() || selectedMedia?.title === mediaSearchTerm) {
          setMediaSuggestions([]);
          return;
        }
        const timer = setTimeout(async () => {
          const results = newMediaType === 'Película'
            ? await searchMoviesAPI(mediaSearchTerm)
            : await searchBooksAPI(mediaSearchTerm);
          setMediaSuggestions(results.slice(0, 3));
        }, 400);
        return () => clearTimeout(timer);
      }, [mediaSearchTerm, newMediaType]);

        e.preventDefault();
        if (!messageInput.trim() || !activeChatId) return;
        setConversations(conversations.map(chat => {

              lastMessage: messageInput,
              time: 'Ahora',
              messages: [...chat.messages, { id: `msg_${Date.now()}`, sender: 'me', text: messageInput, time: 'Ahora' }]

          return chat;

        setMessageInput('');

        }

      };

                      {!isSearching && searchQuery && apiResults.length === 0 && (
                        <div className="bg-white/80 rounded-2xl p-6 text-center text-xs text-slate-500">
                          No se encontraron resultados para "{searchQuery}"
                        </div>
                      )}

                      {!isSearching && !searchQuery && (
                        <div className="bg-white/60 rounded-2xl p-6 text-center text-xs text-slate-500">
                          Escribe arriba para buscar {searchCategory === 'music' ? 'canciones' : searchCategory === 'movies' ? 'películas' : 'libros'} en tiempo real ✨
                        </div>
                      )}

                      {apiResults.map(item => (
                        <div key={item.id} className="bg-white rounded-2xl p-3 shadow-xs border border-white/80 flex items-center justify-between gap-3">
                          <div className="flex items-center space-x-3 overflow-hidden">
                            <img src={item.cover} alt={item.title} className="w-12 h-12 rounded-xl object-cover shrink-0 bg-slate-100" />
                            <div className="min-w-0">
                              <h4 className="text-xs font-bold text-slate-900 truncate">{item.title}</h4>
                              <p className="text-[11px] text-slate-500 truncate">{item.creator} {item.year ? `• ${item.year}` : ''}</p>
                            </div>
                          </div>
                          <button
                            onClick={() => openCreateWithItem(item)}
                            className="shrink-0 bg-[#C8FBEA] hover:bg-[#b2f5de] text-[#C746B3] px-3 py-1.5 rounded-full text-[11px] font-bold flex items-center gap-1"
                          >
                            <Plus size={12} /> Log
                          </button>
                        </div>
                      ))}
                    </div>
                  )}

                  {/* LISTA DE USUARIOS */}
                  {searchCategory === 'users' && (
                    <div className="space-y-2">
                      {usersList.filter(u => u.name.toLowerCase().includes(searchQuery.toLowerCase())).map((user) => (
                        <div key={user.id} className="bg-white rounded-2xl p-3 shadow-xs border border-white/80 flex items-center justify-between">
                          <div className="flex items-center space-x-3">
                            <img src={user.avatar} alt="" className="w-10 h-10 rounded-full object-cover" />
                            <div>
                              <h4 className="text-xs font-bold text-slate-900">{user.name} <span className="text-[10px] text-slate-400 font-normal">{user.handle}</span></h4>
                              <p className="text-[11px] text-slate-500">{user.bio}</p>
                            </div>
                          </div>
                          <button onClick={() => toggleFollowUser(user.id)} className={`px-3 py-1.5 rounded-full text-xs font-bold ${user.isFollowing ? 'bg-slate-100 text-slate-600' : 'bg-[#C746B3] text-white'}`}>
                            {user.isFollowing ? 'Siguiendo' : 'Seguir'}
                          </button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {activeTab === 'memories' && (
                <div className="space-y-4">
                  <div className="flex items-center justify-between px-1">
                    <h2 className="text-sm font-black text-slate-900 flex items-center gap-1.5"><Sparkles size={16} className="text-[#C746B3]" /> Visual Memories</h2>
                    <button onClick={() => setIsCreateModalOpen(true)} className="bg-[#C746B3] text-white px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1"><Plus size={14} /> Nuevo</button>
                  </div>
                  <div className="space-y-4">
                    {memories.map((mem) => (
                      <div key={mem.id} onClick={() => setSelectedMemory(mem)} className="bg-white rounded-[28px] overflow-hidden p-3 shadow-sm border border-white/80 space-y-3 cursor-pointer">
                        <div className="flex items-center space-x-2 px-1">
                          <img src={mem.user.avatar} alt="" className="w-7 h-7 rounded-full object-cover" />
                          <span className="text-xs font-bold text-slate-900">{mem.user.name}</span>
                        </div>
                        <div className="relative aspect-square rounded-2xl overflow-hidden bg-slate-100">
                          <img src={mem.photo} alt="" className="w-full h-full object-cover" />
                          <div className="absolute bottom-3 left-3 right-3 bg-white/85 backdrop-blur-md p-2 rounded-xl flex items-center justify-between">
                            <span className="text-[11px] font-bold text-slate-900 truncate"><Music size={13} className="inline mr-1 text-[#C746B3]" />{mem.music.title} — {mem.music.artist}</span>
                            <span className="text-[10px] font-bold text-[#C746B3] bg-[#C8FBEA] px-2 py-0.5 rounded-full shrink-0">★ {mem.music.rating}</span>
                          </div>
                        </div>
                        <p className="text-xs text-slate-700 px-1 font-medium">{mem.caption}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {activeTab === 'chat' && (
                <div>
                  {!activeChatId ? (
                    <div className="space-y-3">
                      <h2 className="text-xs font-bold tracking-wider text-slate-600 uppercase px-1">Mensajes Directos</h2>
                      {conversations.map((chat) => (
                        <div key={chat.id} onClick={() => setActiveChatId(chat.id)} className="bg-white rounded-2xl p-3.5 shadow-xs border border-white/80 flex items-center justify-between cursor-pointer">
                          <div className="flex items-center space-x-3">
                            <img src={chat.user.avatar} alt="" className="w-11 h-11 rounded-full object-cover" />
                            <div>
                              <h4 className="text-xs font-bold text-slate-900">{chat.user.name}</h4>
                              <p className="text-xs text-slate-500 line-clamp-1">{chat.lastMessage}</p>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  ) : (
                    <div className="bg-white rounded-[28px] border border-white/80 shadow-sm flex flex-col h-[calc(100vh-170px)]">
                      <div className="p-3 px-4 border-b flex items-center space-x-3">
                        <button onClick={() => setActiveChatId(null)}><ArrowLeft size={18} /></button>
                        <img src={activeChat.user.avatar} alt="" className="w-8 h-8 rounded-full object-cover" />
                        <h4 className="text-xs font-bold text-slate-900">{activeChat.user.name}</h4>
                      </div>
                      <div className="flex-1 overflow-y-auto p-4 space-y-3">
                        {activeChat.messages.map((msg) => (
                          <div key={msg.id} className={`flex flex-col ${msg.sender === 'me' ? 'items-end' : 'items-start'}`}>
                            <div className={`max-w-[80%] px-3.5 py-2.5 rounded-2xl text-xs font-medium ${msg.sender === 'me' ? 'bg-[#C746B3] text-white rounded-tr-none' : 'bg-slate-100 text-slate-800 rounded-tl-none'}`}>{msg.text}</div>
                          </div>
                        ))}
                      </div>
                      <form onSubmit={handleSendMessage} className="p-3 border-t flex items-center gap-2">
                        <input type="text" placeholder="Escribe un mensaje..." value={messageInput} onChange={(e) => setMessageInput(e.target.value)} className="flex-1 bg-slate-50 text-xs px-3.5 py-2 rounded-full border focus:outline-none focus:border-[#C746B3]" />
                        <button type="submit" className="bg-[#C746B3] text-white p-2 rounded-full"><Send size={15} /></button>
                      </form>
                    </div>
                  )}
                </div>
              )}

              {activeTab === 'profile' && (
                <div className="space-y-4">
                  <div className="bg-white/90 rounded-[28px] p-5 border shadow-sm text-center">
                    <div className="relative w-20 h-20 mx-auto mb-3">
                      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&auto=format&fit=crop&q=80" alt="" className="w-20 h-20 rounded-full object-cover border-4 border-white shadow-md" />
                    </div>
                    <h2 className="text-lg font-black text-slate-900">Sofía Valenzuela</h2>
                    <p className="text-xs font-bold text-[#C746B3]">@sofia.v</p>
                    <p className="text-xs text-slate-500 mt-2 font-medium">Curando momentos y tracks pop inolvidables 🎀✨</p>
                  </div>

                  <div className="flex bg-white/70 p-1 rounded-2xl border shadow-2xs">
                    <button onClick={() => setProfileSubTab('favorites')} className={`flex-1 py-1.5 text-xs font-bold rounded-xl ${profileSubTab === 'favorites' ? 'bg-[#C746B3] text-white' : 'text-slate-600'}`}>Favoritos</button>
                    <button onClick={() => setProfileSubTab('photos')} className={`flex-1 py-1.5 text-xs font-bold rounded-xl ${profileSubTab === 'photos' ? 'bg-[#C746B3] text-white' : 'text-slate-600'}`}>Galería Fotos</button>
                  </div>

                  {profileSubTab === 'favorites' && (
                    <div className="space-y-4">
                      <div className="bg-white rounded-[24px] p-4 border space-y-3">
                        <h3 className="text-xs font-black uppercase text-slate-800 flex items-center gap-1.5"><Film size={14} className="text-[#C746B3]" /> Películas & Series Favoritas</h3>
                        <div className="grid grid-cols-3 gap-2">
                          {FAVORITE_MEDIA.movies.map((item, idx) => (
                            <div key={idx} className="space-y-1">
                              <div className="relative aspect-[2/3] rounded-xl overflow-hidden bg-slate-100">
                                <img src={item.cover} alt="" className="w-full h-full object-cover" />
                              </div>
                              <h4 className="text-[11px] font-bold text-slate-900 truncate">{item.title}</h4>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}

                  {profileSubTab === 'photos' && (
                    <div className="grid grid-cols-3 gap-2 pb-6">
                      {memories.map((mem) => (
                        <div key={mem.id} onClick={() => setSelectedMemory(mem)} className="aspect-square rounded-2xl overflow-hidden cursor-pointer shadow-2xs bg-white border">
                          <img src={mem.photo} alt="" className="w-full h-full object-cover" />
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </main>

            {/* MODAL MEMORY */}
            {selectedMemory && (
              <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-white w-full max-w-sm rounded-[32px] overflow-hidden shadow-2xl p-4 space-y-3">
                  <div className="flex justify-between items-center">
                    <span className="text-xs font-bold">{selectedMemory.user.name}</span>
                    <button onClick={() => setSelectedMemory(null)}><X size={16} /></button>
                  </div>
                  <img src={selectedMemory.photo} alt="" className="w-full aspect-square object-cover rounded-2xl" />
                  <p className="text-xs text-slate-700">{selectedMemory.caption}</p>
                  <div className="grid grid-cols-2 gap-2 pt-1">
                    <div className="bg-slate-50 p-2 rounded-xl flex items-center gap-2">
                      <img src={selectedMemory.music.cover} className="w-8 h-8 rounded-lg object-cover" />
                      <div className="min-w-0">
                        <p className="text-[10px] font-bold truncate">{selectedMemory.music.title}</p>
                        <p className="text-[9px] text-slate-400 truncate">{selectedMemory.music.artist}</p>
                      </div>
                    </div>
                    <div className="bg-slate-50 p-2 rounded-xl flex items-center gap-2">
                      <img src={selectedMemory.media.cover} className="w-8 h-8 rounded-lg object-cover" />
                      <div className="min-w-0">
                        <p className="text-[10px] font-bold truncate">{selectedMemory.media.title}</p>
                        <p className="text-[9px] text-slate-400 truncate">{selectedMemory.media.type}</p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* MODAL CREAR CON AUTOCOMPLETADO DE APIS */}
            {isCreateModalOpen && (
              <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-white w-full max-w-md rounded-[32px] p-5 space-y-4 max-h-[90vh] overflow-y-auto">
                  <div className="flex justify-between items-center">
                    <h3 className="text-base font-bold">Crear Nuevo Memory</h3>
                    <button onClick={() => setIsCreateModalOpen(false)}><X size={16} /></button>
                  </div>
                  <form onSubmit={handleCreateMemory} className="space-y-3">
                    <input
                      type="url"
                      placeholder="URL de la Foto (ej. https://...)"
                      value={newPhotoUrl}
                      onChange={e => setNewPhotoUrl(e.target.value)}
                      required
                      className="w-full p-2.5 text-xs rounded-xl border bg-slate-50"
                    />
                    <input
                      type="text"
                      placeholder="Pie de foto..."
                      value={newCaption}
                      onChange={e => setNewCaption(e.target.value)}
                      className="w-full p-2.5 text-xs rounded-xl border bg-slate-50"
                    />

                    {/* BUSCADOR EN VIVO DE CANCIÓN */}
                    <div className="relative">
                      <label className="text-[10px] font-bold text-slate-500 uppercase ml-1">Música (Busca en la API)</label>
                      <input
                        type="text"
                        placeholder="Escribe una canción o artista..."
                        value={songSearchTerm}
                        onChange={e => { setSongSearchTerm(e.target.value); setSelectedSong(null); }}
                        required
                        className="w-full p-2.5 text-xs rounded-xl border bg-slate-50 mt-1"
                      />
                      {songSuggestions.length > 0 && (
                        <div className="mt-1 bg-white border rounded-xl shadow-md divide-y">
                          {songSuggestions.map(s => (
                            <div
                              key={s.id}
                              onClick={() => { setSelectedSong(s); setSongSearchTerm(s.title); setSongSuggestions([]); }}
                              className="p-2 flex items-center gap-2 hover:bg-slate-50 cursor-pointer"
                            >
                              <img src={s.cover} className="w-8 h-8 rounded-md object-cover" />
                              <div className="min-w-0">
                                <p className="text-xs font-bold truncate">{s.title}</p>
                                <p className="text-[10px] text-slate-500 truncate">{s.creator}</p>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                    {/* SELECTOR DE PELÍCULA O LIBRO + BUSCADOR EN VIVO */}
                    <div className="relative">
                      <div className="flex items-center justify-between ml-1">
                        <label className="text-[10px] font-bold text-slate-500 uppercase">Cultura (Busca en la API)</label>
                        <div className="flex gap-1">
                          {['Película', 'Libro'].map(type => (
                            <button
                              type="button"
                              key={type}
                              onClick={() => { setNewMediaType(type); setSelectedMedia(null); setMediaSuggestions([]); }}
                              className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${newMediaType === type ? 'bg-[#C746B3] text-white' : 'bg-slate-100 text-slate-600'}`}
                            >
                              {type}
                            </button>
                          ))}
                        </div>
                      </div>
                      <input
                        type="text"
                        placeholder={`Escribe el título de ${newMediaType === 'Película' ? 'la película' : 'el libro'}...`}
                        value={mediaSearchTerm}
                        onChange={e => { setMediaSearchTerm(e.target.value); setSelectedMedia(null); }}
                        required
                        className="w-full p-2.5 text-xs rounded-xl border bg-slate-50 mt-1"
                      />
                      {mediaSuggestions.length > 0 && (
                        <div className="mt-1 bg-white border rounded-xl shadow-md divide-y">
                          {mediaSuggestions.map(m => (
                            <div
                              key={m.id}
                              onClick={() => { setSelectedMedia(m); setMediaSearchTerm(m.title); setMediaSuggestions([]); }}
                              className="p-2 flex items-center gap-2 hover:bg-slate-50 cursor-pointer"
                            >
                              <img src={m.cover} className="w-8 h-8 rounded-md object-cover" />
                              <div className="min-w-0">
                                <p className="text-xs font-bold truncate">{m.title}</p>
                                <p className="text-[10px] text-slate-500 truncate">{m.creator}</p>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                    <button type="submit" className="w-full bg-[#C746B3] text-white font-bold text-sm py-3 rounded-2xl">
                      Publicar en popclub.
                    </button>
                  </form>
                </div>
              </div>
            )}

            {/* NAV BAR */}
            <nav className="fixed bottom-0 left-0 right-0 z-40 flex justify-center">
              <div className="w-full max-w-md bg-white/90 backdrop-blur-lg border-t px-4 py-2 flex items-center justify-between shadow-lg">
                <button onClick={() => setActiveTab('feed')} className={`flex flex-col items-center gap-0.5 ${activeTab === 'feed' ? 'text-[#C746B3]' : 'text-slate-400'}`}><Compass size={19} /><span className="text-[9px] font-bold">Feed</span></button>
                <button onClick={() => setActiveTab('search')} className={`flex flex-col items-center gap-0.5 ${activeTab === 'search' ? 'text-[#C746B3]' : 'text-slate-400'}`}><Search size={19} /><span className="text-[9px] font-bold">Buscar</span></button>
                <button onClick={() => setActiveTab('memories')} className={`flex flex-col items-center gap-0.5 ${activeTab === 'memories' ? 'text-[#C746B3]' : 'text-slate-400'}`}><Grid size={19} /><span className="text-[9px] font-bold">Memories</span></button>
                <button onClick={() => setActiveTab('chat')} className={`flex flex-col items-center gap-0.5 ${activeTab === 'chat' ? 'text-[#C746B3]' : 'text-slate-400'}`}><MessageSquare size={19} /><span className="text-[9px] font-bold">Chat</span></button>
                <button onClick={() => setActiveTab('profile')} className={`flex flex-col items-center gap-0.5 ${activeTab === 'profile' ? 'text-[#C746B3]' : 'text-slate-400'}`}><User size={19} /><span className="text-[9px] font-bold">Perfil</span></button>
              </div>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
